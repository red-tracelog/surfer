[package]
name = "surfer-vpi-plugin"
version.workspace = true
license.workspace = true
categories.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib"]

[features]
default = []
# Many simulators do not support vpi_get_cb_info, so that is not enabled by default.
# If the simulator supports it, you can enable it to get a slightly safer removal of callbacks.
cb_info = ["vpi/cb_info"]

[target.'cfg(any(windows, all(unix, not(target_os = "macos"))))'.dependencies]
libloading = "0.8.9"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { workspace = true, default-features = false, features = [
    "macros",
    "net",
    "rt",
    "rt-multi-thread",
    "time",
] }

[dependencies]
portable-atomic.workspace = true
surfer-simulator-protocol = { workspace = true, features = ["plugin-tcp"] }
vpi.workspace = true
