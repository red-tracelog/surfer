        import init from '{base}{js}';
        await init({module_or_path: '{base}{wasm}'});
        import {WebHandle, inject_message, id_of_name, draw_text_arrow, inject_simulation_proxy_message} from '{base}{js}';
        window.inject_message = inject_message;
        window.id_of_name = id_of_name;
        window.draw_text_arrow = draw_text_arrow;
        window.inject_simulation_proxy_message = inject_simulation_proxy_message;
        /*SURFER_SETUP_HOOKS*/
    </script>
    """

